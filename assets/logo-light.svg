<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="paw-claude-kit: huella con prompt de terminal">
  <title>paw-claude-kit</title>
  <!-- dedos: celeste mezclado con marrón (mismo mix que --link en light) -->
  <g fill="#617a89">
    <ellipse cx="11.8" cy="26.3" rx="5.4" ry="7.2" transform="rotate(-24 11.8 26.3)"/>
    <ellipse cx="24.6" cy="16.6" rx="5.7" ry="7.8" transform="rotate(-9 24.6 16.6)"/>
    <ellipse cx="39.4" cy="16.6" rx="5.7" ry="7.8" transform="rotate(9 39.4 16.6)"/>
    <ellipse cx="52.2" cy="26.3" rx="5.4" ry="7.2" transform="rotate(24 52.2 26.3)"/>
  </g>
  <!-- almohadilla central = bloque de terminal con prompt >_ calado -->
  <mask id="paw-prompt">
    <rect x="16.5" y="31" width="31" height="25" rx="7.5" fill="#fff"/>
    <path d="M24.5 38 32.5 43.5 24.5 49" fill="none" stroke="#000" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="36" y="46.8" width="6.4" height="4.2" rx="2.1" fill="#000"/>
  </mask>
  <rect x="16.5" y="31" width="31" height="25" rx="7.5" fill="#a5543a" mask="url(#paw-prompt)"/>
</svg>
